<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IGA Platform - API Documentation</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://unpkg.com/swagger-ui-dist@5.10.3/swagger-ui.css"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: #f4f7f9;
      }
      #main-content {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1rem;
      }
      .container {
        text-align: center;
        background: white;
        padding: 2rem 3rem;
        border-radius: 10px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        max-width: 700px;
        width: 90%;
      }
      h1 {
        color: #2d3748;
        margin-bottom: 1rem;
      }
      .container p {
        color: #718096;
        margin-bottom: 2.5rem;
      }
      .spec-section {
        margin-bottom: 2.5rem;
        padding-bottom: 1.5rem;
        border-bottom: 1px solid #e2e8f0;
      }
      .spec-section:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
      }
      .spec-section h2 {
        color: #4a5568;
        margin-bottom: 0.5rem;
      }
      .filename {
        font-family: monospace;
        color: #a0aec0;
        font-size: 0.8rem;
        margin-top: -0.25rem;
        margin-bottom: 1.5rem;
      }
      .button {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        margin: 0.25rem 0.5rem;
        background: #667eea;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        transition: background 0.3s ease;
        font-weight: 500;
        border: none;
        cursor: pointer;
      }
      .button:hover {
        background: #5a6fd8;
      }
      .button.swagger {
        background: #85ea2d;
      }
      .button.swagger:hover {
        background: #6bc923;
      }
      /* Ensure UI containers take full space when active */
      #redoc-container,
      #swagger-ui {
        width: 100%;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="main-content">
      <!-- This content will be dynamically generated by the script -->
    </div>

    <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.10.3/swagger-ui-bundle.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const mainContent = document.getElementById("main-content");
        const urlParams = new URLSearchParams(window.location.search);
        const specFile = urlParams.get("spec");
        const ui = urlParams.get("ui") || "redoc";

        if (specFile) {
          // --- VIEWER MODE ---
          // A spec file is specified in the URL, so load the appropriate viewer.
          mainContent.style.padding = "0"; // Remove padding for full-screen view

          if (ui === "swagger") {
            mainContent.innerHTML = '<div id="swagger-ui"></div>';
            SwaggerUIBundle({
              url: specFile,
              dom_id: "#swagger-ui",
              deepLinking: true,
              presets: [SwaggerUIBundle.presets.apis],
            });
          } else {
            mainContent.innerHTML = '<div id="redoc-container"></div>';
            Redoc.init(
              specFile,
              {
                scrollYOffset: 50,
                theme: { colors: { primary: { main: "#667eea" } } },
              },
              document.getElementById("redoc-container")
            );
          }
        } else {
          // --- LANDING PAGE MODE ---
          // No spec file in URL, so "scan" for local specs and display the landing page.

          // This array simulates scanning the local directory.
          // Just add or remove filenames here to update the landing page.
          const specFiles = [
            "applications_spec.yml",
            "common_components.yml",
            "common_schemas.yml",
            "identity_governance_policy_spec.yml",
            "shadow_management_spec.yml",
            "sync_policy_spec.yml",
            "task_management_spec.yml",
          ];

          let landingPageHTML = `
                    <div class="container">
                        <h1>IGA Platform API Documentation</h1>
                        <p>Select a microservice specification to view its documentation.</p>
                `;

          // Generate a section for each detected spec file
          specFiles.forEach((file) => {
            // Create a more user-friendly title from the filename
            const title = file
              .replace(/_api\.yml|_spec\.yml|\.yml/gi, "") // Remove suffixes
              .replace(/_/g, " ") // Replace underscores with spaces
              .replace(/\b\w/g, (l) => l.toUpperCase()); // Capitalize words

            landingPageHTML += `
                        <div class="spec-section">
                            <h2>${title}</h2>
                            <p class="filename">(${file})</p>
                            <a href="?ui=redoc&spec=${file}" class="button">View with ReDoc</a>
                            <a href="?ui=swagger&spec=${file}" class="button swagger">View with Swagger UI</a>
                        </div>
                    `;
          });

          landingPageHTML += `</div>`;
          mainContent.innerHTML = landingPageHTML;
        }
      });
    </script>
  </body>
</html>
