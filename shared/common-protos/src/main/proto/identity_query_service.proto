syntax = "proto3";

package com.aidentx.dal.protos.identity;

import "google/protobuf/struct.proto";
import "google/protobuf/empty.proto";
import "identity_service.proto";

option java_multiple_files = true;
option java_package = "com.aidentx.dal.protos.identity";
option java_outer_classname = "IdentityQueryServiceProto";

// ===================================================================
//  Identity Query Service for Advanced Identity Searching
// ===================================================================
service IdentityQueryService {
  // Advanced native query for finding identities based on complex criteria
  rpc FindIdentitiesByNativeQuery(FindIdentitiesByNativeQueryRequest) returns (FindIdentitiesByNativeQueryResponse);

  // Search identities by multiple criteria with pagination
  rpc SearchIdentities(IdentitySearchRequest) returns (IdentitySearchResponse);
}

// ===================================================================
//  Query Request/Response Messages
// ===================================================================

// Request for finding identities using native query syntax
message FindIdentitiesByNativeQueryRequest {
  string tenant_id = 1;
  string native_query = 2; // Native query string (e.g., SQL-like syntax)
  string parameterized_where_clause = 3; // Parameterized WHERE clause
  repeated google.protobuf.Value parameters = 4; // Query parameters
  int32 limit = 5; // Maximum number of results to return
  int32 offset = 6; // Number of results to skip
}

// Response containing the found identities
message FindIdentitiesByNativeQueryResponse {
  repeated IdentityMessage identities = 1;
  int32 total_count = 2; // Total number of matching identities
  bool has_more = 3; // Whether there are more results available
}

// Advanced search request with multiple criteria
message IdentitySearchRequest {
  string tenant_id = 1;
  repeated SearchCriterion criteria = 2; // List of search criteria
  SearchOptions options = 3; // Search options like pagination, sorting
}

// Individual search criterion
message SearchCriterion {
  string field_name = 1; // Field to search in (e.g., "username", "email")
  string operator = 2; // Search operator (EQUALS, CONTAINS, STARTS_WITH, etc.)
  string value = 3; // Search value
  string data_type = 4; // Data type of the field (STRING, NUMBER, DATE, etc.)
}

// Search options for pagination and sorting
message SearchOptions {
  int32 page_size = 1; // Number of results per page
  int32 page_number = 2; // Page number (0-based)
  repeated SortOption sort_by = 3; // Sorting criteria
}

// Sorting option
message SortOption {
  string field_name = 1; // Field to sort by
  string direction = 2; // ASC or DESC
}

// Search response
message IdentitySearchResponse {
  repeated IdentityMessage identities = 1;
  int32 total_count = 2; // Total number of matching identities
  int32 page_number = 3; // Current page number
  int32 total_pages = 4; // Total number of pages
}
