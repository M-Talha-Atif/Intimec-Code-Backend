# ============================================
# COMMON CONFIGURATION (ALL PROFILES)
# ============================================

# Application
spring.application.name=access-portal-service

# Default profile
spring.profiles.active=dev

# Log4j2 configuration
logging.config=classpath:log4j2.json
log4j.configurationFile=log4j2.json

# Unified logging app name
logging.app-name=access-portal-service

# ============================================
# DATABASE CONFIGURATION (COMMON)
# ============================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.type.preferred_json_mapper=jsonb

# ============================================
# SPRING BOOT ACTUATOR
# ============================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true