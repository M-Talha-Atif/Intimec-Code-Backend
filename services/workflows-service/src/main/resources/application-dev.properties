# Server Configuration
server.port=8098
spring.application.name=workflows-service

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/intimec}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:0;ZA9V{2`2Hu}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.type.preferred_json_mapper=jsonb

# Logging
logging.level.com.aidentx.workflowsservice=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Management
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# ===================================================================
#                     QUARTZ SCHEDULER CONFIGURATION
# ===================================================================
# Use Spring's DataSource for Quartz (auto-configured)
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=always

# Quartz Scheduler Properties
spring.quartz.properties.org.quartz.scheduler.instanceName=WorkflowScheduler
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.scheduler.skipUpdateCheck=true

# Thread Pool - Small pool since Quartz only TRIGGERS workflows
spring.quartz.properties.org.quartz.threadPool.class=org.quartz.simpl.SimpleThreadPool
spring.quartz.properties.org.quartz.threadPool.threadCount=3
spring.quartz.properties.org.quartz.threadPool.threadPriority=5
spring.quartz.properties.org.quartz.threadPool.threadsInheritContextClassLoaderOfInitializingThread=true

# Job Store - PostgreSQL (using Spring's LocalDataSourceJobStore)
spring.quartz.properties.org.quartz.jobStore.class=org.springframework.scheduling.quartz.LocalDataSourceJobStore
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
spring.quartz.properties.org.quartz.jobStore.useProperties=false
spring.quartz.properties.org.quartz.jobStore.tablePrefix=QRTZ_
spring.quartz.properties.org.quartz.jobStore.isClustered=false
spring.quartz.properties.org.quartz.jobStore.misfireThreshold=60000

# ===================================================================
#                     REST CLIENT CONFIGURATION
# ===================================================================
# Identity Service REST API
identity.service.rest.url=${IDENTITY_SERVICE_REST_URL:http://localhost:8094}

# REST Client Timeouts
rest.client.connection.timeout=5000
rest.client.read.timeout=10000

# ===================================================================
#                     GRPC CLIENT CONFIGURATION
# ===================================================================
# Identity Service - for user/identity management
grpc.client.identity-service.address=${GRPC_CLIENT_IDENTITY-SERVICE_ADDRESS:dns:///localhost:9096}
grpc.client.identity-service.negotiation-type=plaintext

# Auth Service - for user validation and lookups
grpc.client.auth-service.address=${GRPC_CLIENT_AUTH-SERVICE_ADDRESS:dns:///localhost:8002}
grpc.client.auth-service.negotiation-type=plaintext
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8090}

# Core Service - for notifications and audit logging
grpc.client.core-service.address=${GRPC_CLIENT_CORE-SERVICE_ADDRESS:dns:///localhost:9095}
grpc.client.core-service.negotiation-type=plaintext
core.service.rest.url=${CORE_SERVICE_REST_URL:http://localhost:8091}

# Application Permissions Service - for roles and permissions
grpc.client.application-permissions-service.address=${GRPC_CLIENT_APPLICATION-PERMISSIONS-SERVICE_ADDRESS:dns:///localhost:8001}
grpc.client.application-permissions-service.negotiation-type=plaintext

# Configuration Service - for configuration management
grpc.client.configuration-service.address=${GRPC_CLIENT_CONFIGURATION-SERVICE_ADDRESS:dns:///localhost:9091}
grpc.client.configuration-service.negotiation-type=plaintext

# ===================================================================
#                     KAFKA CONFIGURATION
# ===================================================================
# Kafka Bootstrap Servers
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Kafka Producer Configuration (matches team pattern from auth-service)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# Kafka Consumer Configuration (for future use)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Notification Topic
notification.kafka.topic=user-notifications

# Audit Log Topic
auditlog.kafka.topic=audit-log

# ===================================================================
#                     OPENSEARCH CONFIGURATION
# ===================================================================
# OpenSearch Configuration
opensearch.url=${OPENSEARCH_URL:http://localhost:9200}
opensearch.username=${OPENSEARCH_USERNAME:admin}
opensearch.password=${OPENSEARCH_PASSWORD:!Admin123456}

# ===================================================================
#                     WORKFLOW EXECUTION CONFIGURATION
# ===================================================================
# Thread Pool Configuration for Async Workflow Execution
workflow.executor.thread-pool.core-size=10
workflow.executor.thread-pool.max-size=20
workflow.executor.thread-pool.queue-capacity=500
workflow.executor.thread-pool.await-termination-seconds=60
