# Active Profile
spring.profiles.active=dev,resilience

# Server Configuration
server.port=8098
spring.application.name=workflows-service

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/intimec
spring.datasource.username=postgres
spring.datasource.password=0;ZA9V{2`2Hu
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Disable Flyway - using Hibernate DDL auto-update instead
