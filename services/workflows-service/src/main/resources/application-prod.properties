# Production Profile Configuration for workflows-service
# This file is used when running in Docker containers on VM

# Server Configuration
server.port=8098
spring.application.name=workflows-service

# Database Configuration (Docker host access)
spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/intimec
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:0;ZA9V{2`2Hu}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.type.preferred_json_mapper=jsonb

# Logging (Less verbose in production)
logging.level.com.aidentx.workflowsservice=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Management
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized

# ===================================================================
#                     REST CLIENT CONFIGURATION
# ===================================================================
# Identity Service REST API (Docker container name)
identity.service.rest.url=http://identity-service:8094

# REST Client Timeouts
rest.client.connection.timeout=5000
rest.client.read.timeout=10000

# ===================================================================
#                     GRPC CLIENT CONFIGURATION
# ===================================================================
# Identity Service - for user/identity management
grpc.client.identity-service.address=dns:///identity-service:9096
grpc.client.identity-service.negotiation-type=plaintext

# Auth Service - for user validation and lookups
grpc.client.auth-service.address=dns:///auth-service:8002
grpc.client.auth-service.negotiation-type=plaintext
auth.service.url=http://auth-service:8090

# Core Service - for notifications and audit logging
grpc.client.core-service.address=dns:///core-service:9095
grpc.client.core-service.negotiation-type=plaintext

# Application Permissions Service - for roles and permissions
grpc.client.application-permissions-service.address=dns:///application-permissions-service:8001
grpc.client.application-permissions-service.negotiation-type=plaintext

# Configuration Service - for configuration management
grpc.client.configuration-service.address=dns:///configuration-service:9091
grpc.client.configuration-service.negotiation-type=plaintext

# ===================================================================
#                     KAFKA CONFIGURATION
# ===================================================================
# Kafka Bootstrap Servers (Docker internal network)
spring.kafka.bootstrap-servers=kafka:29092

# Kafka Producer Configuration (matches team pattern from auth-service)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# Kafka Consumer Configuration (for future use)
spring.kafka.consumer.group-id=workflow-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Notification Topic
notification.kafka.topic=user-notifications

# ===================================================================
#                     JWT CONFIGURATION
# ===================================================================
# JWT Secret (should be externalized via environment variable in production)
jwt.secret=${JWT_SECRET:mySuperSecretKey12345678901234AZERTY123456789}

# ===================================================================
#                     QUARTZ SCHEDULER CONFIGURATION
# ===================================================================
# Quartz Job Store Configuration
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=always

# Quartz Properties - Scheduler
spring.quartz.properties.org.quartz.scheduler.instanceName=WorkflowScheduler
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.scheduler.skipUpdateCheck=true

# Quartz Properties - Thread Pool (only 3 threads for triggering)
spring.quartz.properties.org.quartz.threadPool.class=org.quartz.simpl.SimpleThreadPool
spring.quartz.properties.org.quartz.threadPool.threadCount=3
spring.quartz.properties.org.quartz.threadPool.threadPriority=5

# Quartz Properties - Job Store (using Spring's LocalDataSourceJobStore)
spring.quartz.properties.org.quartz.jobStore.class=org.springframework.scheduling.quartz.LocalDataSourceJobStore
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
spring.quartz.properties.org.quartz.jobStore.useProperties=false
spring.quartz.properties.org.quartz.jobStore.tablePrefix=QRTZ_
spring.quartz.properties.org.quartz.jobStore.isClustered=false
spring.quartz.properties.org.quartz.jobStore.misfireThreshold=60000

# ===================================================================
#                     WORKFLOW EXECUTION CONFIGURATION
# ===================================================================
# Thread Pool Configuration for Async Workflow Execution
# This is used by WorkflowExecutionService for actual workflow execution
# Quartz scheduler (only 3 threads) triggers jobs, then hands off to this pool
workflow.executor.thread-pool.core-size=20
workflow.executor.thread-pool.max-size=50
workflow.executor.thread-pool.queue-capacity=1000
workflow.executor.thread-pool.await-termination-seconds=60
