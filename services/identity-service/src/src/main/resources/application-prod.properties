spring.jpa.hibernate.ddl-auto=update

# Access role risk insights max closure depth contributing to counts
access-roles.risk-insights.max-depth=15

# Access role async import configuration
access-roles.import.max-rows=100000
access-roles.import.batch-size=100
access-roles.import.topic=role-import-events
access-roles.import.consumer-group=identity-service-role-import
access-roles.import.error-report-retention-days=30
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
