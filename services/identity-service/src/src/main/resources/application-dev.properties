# ===================================================================
#                     APPLICATION CONFIGURATION
# ===================================================================
# Environment and basic application settings
sp.environment=dev

# Access role risk insights max closure depth contributing to counts
access-roles.risk-insights.max-depth=15

# Access role async import configuration
access-roles.import.max-rows=100000
access-roles.import.batch-size=100
access-roles.import.topic=role-import-events
access-roles.import.consumer-group=identity-service-role-import
access-roles.import.error-report-retention-days=30
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.application.name=identity-service
server.port=8094
app.base-url=http://localhost:8094

# Serialize java.time types as ISO-8601 strings instead of numeric timestamps
spring.jackson.serialization.write-dates-as-timestamps=false

# Disable Spring Boot DevTools restart to avoid MapStruct bean registration issues
spring.devtools.restart.enabled=false

# ===================================================================
#                     DATABASE CONFIGURATION
# ===================================================================
# PostgreSQL database connection settings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/intimec?stringtype=unspecified}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:0;ZA9V{2`2Hu}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
#                     CONNECTION POOL (HikariCP)
# ===================================================================
# Pool size supports parallel sync workers (10 workers + 2 for other operations)
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=4

# JPA/Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.separator=;
spring.sql.init.continue-on-error=false

# ===================================================================
#                     HIBERNATE BATCH INSERT OPTIMIZATION
# ===================================================================
# Batch size: 50 records per SQL statement (instead of 1)
spring.jpa.properties.hibernate.jdbc.batch_size=50
# Reorder inserts by entity type for efficient batching
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Batch versioned (optimistic lock) entities
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true



# ===================================================================
#                     SECURITY & JWT CONFIGURATION
# ===================================================================
# JWT token settings - Production ready configuration
jwt.secret=mySuperSecretKey12345678901234AZERTY123456789
jwt.expiration=86400
jwt.issuer=aidentx-identities-service
jwt.refresh-enabled=false
jwt.refresh-expiration=604800

# Legacy JWT settings for backward compatibility
security.jwt.refresh-token.expiration-ms=604800000

# Password encoding strength
security.password.encoder.strength=10

# ===================================================================
#                     FRONTEND INTEGRATION
# ===================================================================
# Frontend application URLs and callback endpoints
front.url=http://localhost:3000
front.url.callback=/auth/callback
front.url.sso_callback=/auth/callback

# ===================================================================
#                     CORE SERVICE INTEGRATION
# ===================================================================
# Core service connection settings for schema definitions
core-service.base-url=http://localhost:8091
core-service.schema.endpoint=/api/v1/identity-schemas
core-service.connection.timeout=5000
core-service.read.timeout=10000

# ===================================================================
#                     SESSION CONFIGURATION
# ===================================================================
# Session settings for OAuth2/SAML flows
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.tracking-modes=cookie
spring.session.store-type=none

# ===================================================================
#                     EMAIL CONFIGURATION
# ===================================================================
# SMTP settings for password reset emails
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=info.aidentx@gmail.com
spring.mail.password=oaef ycjg erye qtyd
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.service=gmail

# ===================================================================
#                     SPRING BOOT CONFIGURATION
# ===================================================================
# Auto-configuration exclusions
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

# Template engine configuration
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=false

# ===================================================================
#                     SPRING CLOUD CONFIGURATION
# ===================================================================
# Spring Cloud Config Client settings
spring.cloud.config.enabled=false
spring.cloud.config.fail-fast=false
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-interval=2000
spring.cloud.config.retry.max-attempts=6

spring.cloud.config.import-check.enabled=false

# ===================================================================
#                     SPRING BOOT ACTUATOR CONFIGURATION
# ===================================================================
# Enable actuator endpoints for configuration refresh
management.endpoints.web.exposure.include=health,info,refresh,configprops,env
management.endpoint.refresh.enabled=true
management.endpoint.configprops.enabled=true
management.endpoint.env.enabled=true
management.endpoints.web.base-path=/actuator

# Disable automatic health checks that we don't need
management.health.ldap.enabled=false
management.health.db.enabled=false
management.health.diskspace.enabled=false
management.endpoint.health.show-details=always

# ===================================================================
#                     LOGGING CONFIGURATION
# ===================================================================
# Disable verbose SAML/OAuth2 logging (detailed logging is in log4j2.json)
logging.level.org.springframework.security.saml2=OFF
logging.level.org.springframework.security.saml2.provider=OFF
logging.level.org.opensaml=OFF

# Enable console colors for better readability
spring.output.ansi.enabled=always
spring.output.ansi.console-available=true

# Completely disable Hibernate SQL logging for cleaner output
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicExtractor=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.springframework.orm.jpa=ERROR
logging.level.org.springframework.transaction=ERROR
# ===================================================================
#          ENCRYPTION SERVICE & STORAGE CONFIGURATION
# ===================================================================
# Storage Configuration:
# The application automatically determines the correct storage path based on the
# operating system (e.g., /etc/configservice on Linux, C:\ProgramData\aidentx\ConfigService on Windows).
#
# You only need to set the property below if you want to explicitly override this
# default behavior and use a custom location for all security-related files (keys, UUID).
#
# Optional: Uncomment and set a custom base directory.
# Note: Use forward slashes for paths, even on Windows, as Spring handles the conversion.
# Example (Linux): encryption.storage.base-directory=/var/lib/configservice
# Example (Windows): encryption.storage.base-directory=D:/appdata/configservice
encryption.storage.base-directory=./encryption-storage

# Master Key Configuration:
# These values are used for key derivation and encryption operations
encryption.master_key.master_secret=mySuperSecretKey12345678901234AZERTY123456789
encryption.master_key.master_salt=ConfigServiceSalt2025

# Bootstrap Configuration:
# WARNING: Setting first-run to true will overwrite existing master key.
# If the master key changes, all encrypted data will become inaccessible.
# Use only for fresh installations or planned key rotation.
encryption.bootstrap.first-run=true


# ===================================================================
#                     KAFKA PRODUCER CONFIGURATION
# ===================================================================
# Address of the Kafka broker (use your local IP since Kafka advertises this)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Kafka serializer class for the message key
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# Kafka serializer class for the message value
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Use gzip compression (pure Java, no native libs required - avoids Snappy glibc issue on Alpine)
spring.kafka.producer.compression-type=gzip

# ===================================================================
#                     UNIFIED LOGGING CONFIGURATION
# ===================================================================
# Enable unified logging
unified.logging.enabled=true

# Correlation ID settings
unified.logging.correlation-id.enabled=true
unified.logging.correlation-id.header-name=X-Correlation-ID
unified.logging.correlation-id.auto-generate=true

# JSON format settings
unified.logging.json-format.pretty-print=false
unified.logging.json-format.include-nulls=false

# ===================================================================
#                     MICROSERVICE CONFIGURATION
# ===================================================================
# Service URLs for inter-service communication
# These will be overridden by Docker environment variables in containerized environments
gateway.auth.service.url=${GATEWAY_AUTH_SERVICE_URL:http://localhost:8090}
gateway.core.service.url=${GATEWAY_CORE_SERVICE_URL:http://localhost:8091}
api.gateway.url=${API_GATEWAY_URL:http://localhost:8081}


# ===================================================================
#                     OPENSEARCH CONFIGURATION
# ===================================================================
# OpenSearch settings for logging and search capabilities
# These will be overridden by Docker environment variables in containerized environments
opensearch.url=${OPENSEARCH_URL:http://localhost:9200}
opensearch.username=${OPENSEARCH_USERNAME:admin}
opensearch.password=${OPENSEARCH_PASSWORD:!Admin123456}


# ===================================================================
#                     DGRAPH CONFIGURATION
# ===================================================================
# Dgraph database connection settings for graph relationships
dgraph.hosts=${DGRAPH_HOSTS:localhost:9080}
dgraph.database=${DGRAPH_DATABASE:default}
dgraph.connection.timeout=10000
dgraph.connection.max-idle=10

# ===================================================================
# SERVICE DISCOVERY CONFIGURATION
# ===================================================================

# gRPC client configuration for the Core Service
grpc.client.core-service.address=${CORE_GRPC_ADDRESS:dns:///localhost:9095}
grpc.client.core-service.negotiation-type=plaintext

grpc.client.configuration-service.address=${CORE_GRPC_ADDRESS:dns:///localhost:9091}
grpc.client.configuration-service.negotiation-type=plaintext

grpc.client.auth-service.address=${AUTH_GRPC_ADDRESS:dns:///localhost:8002}
grpc.client.auth-service.negotiation-type=plaintext

grpc.server.port=${GRPC_SERVER_PORT:9096}
# Increase max message size for batch import payloads (default 4MB ? 64MB)
grpc.server.max-inbound-message-size=67108864

# ===================================================================
#                     ERROR HANDLING CONFIGURATION
# ===================================================================
# Disable stack traces in error responses to prevent sensitive information exposure
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always

