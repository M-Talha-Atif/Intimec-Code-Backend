# ===================================================================
#                     APPLICATION CONFIGURATION
# ===================================================================
# Environment and basic application settings
sp.environment=dev
spring.application.name=task-management-service
server.port=8096
app.base-url=http://localhost:8096

# ===================================================================
#                     DATABASE CONFIGURATION
# ===================================================================
# PostgreSQL database connection settings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/intimec}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=0;ZA9V{2`2Hu
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# ===================================================================
#                     SWAGGER/OPENAPI CONFIGURATION
# ===================================================================
# Swagger UI configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true

# ===================================================================
# QUARTZ SCHEDULER CONFIGURATION
# ===================================================================
# Quartz properties
spring.quartz.job-store-type=jdbc
spring.quartz.auto-startup=true
spring.quartz.startup-delay=0s
spring.quartz.wait-for-jobs-to-complete-on-shutdown=true
spring.quartz.overwrite-existing-jobs=true
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.scheduler.instanceName=QuartzScheduler
spring.quartz.properties.org.quartz.jobStore.class=org.springframework.scheduling.quartz.LocalDataSourceJobStore
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
spring.quartz.properties.org.quartz.jobStore.tablePrefix=QRTZ_
spring.quartz.properties.org.quartz.jobStore.isClustered=false
spring.quartz.properties.org.quartz.jobStore.useProperties=true
spring.quartz.properties.org.quartz.threadPool.class=com.aidentx.taskmanagement.config.VirtualThreadPool
# Virtual threads: no fixed pool size — scales automatically to any volume.
# The threadCount and threadPriority properties are ignored by VirtualThreadPool.
# Misfire and trigger acquisition settings
spring.quartz.properties.org.quartz.jobStore.misfireThreshold=60000
spring.quartz.properties.org.quartz.jobStore.acquireTriggersWithinLock=true
spring.quartz.properties.org.quartz.scheduler.batchTriggerAcquisitionMaxCount=50
spring.quartz.properties.org.quartz.scheduler.idleWaitTime=1000
# Datasource is always intialized but scripts don't drop already existing tables
spring.quartz.jdbc.initialize-schema=always
spring.quartz.jdbc.schema=classpath:quartz_tables_postgres.sql

# ===================================================================
#                     SECURITY & JWT CONFIGURATION
# ===================================================================
# JWT token settings - Production ready configuration
jwt.secret=mySuperSecretKey12345678901234AZERTY123456789
jwt.expiration=86400
jwt.issuer=aidentx-core-service
jwt.refresh-enabled=false
jwt.refresh-expiration=604800

# Legacy JWT settings for backward compatibility
security.jwt.refresh-token.expiration-ms=604800000

# Password encoding strength
security.password.encoder.strength=10

# ===================================================================
#                     SPRING BOOT CONFIGURATION
# ===================================================================
# Auto-configuration exclusions
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

# Template engine configuration
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=false

# ===================================================================
#                     SPRING CLOUD CONFIGURATION
# ===================================================================
# Spring Cloud Config Client settings
spring.cloud.config.enabled=false
spring.cloud.config.fail-fast=false
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-interval=2000
spring.cloud.config.retry.max-attempts=6

spring.cloud.config.import-check.enabled=false

# ===================================================================
#                     SPRING BOOT ACTUATOR CONFIGURATION
# ===================================================================
# Enable actuator endpoints for configuration refresh
management.endpoints.web.exposure.include=health,info,refresh,configprops,env

# ===================================================================
#                     GRPC CONFIGURATION
# ===================================================================
# gRPC server port configuration
grpc.server.port=9097
management.endpoint.refresh.enabled=true
management.endpoint.configprops.enabled=true
management.endpoint.env.enabled=true
management.endpoints.web.base-path=/actuator

# Disable automatic health checks that we don't need
management.health.ldap.enabled=false
management.health.db.enabled=false
management.health.diskspace.enabled=false
management.endpoint.health.show-details=always

# ===================================================================
#                     KAFKA CONFIGURATION
# ===================================================================
# Bootstrap servers for IGA task audit event publishing
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ===================================================================
#                     LOGGING CONFIGURATION
# ===================================================================
# Disable verbose SAML/OAuth2 logging (detailed logging is in log4j2.json)
logging.level.org.springframework.security.saml2=OFF
logging.level.org.springframework.security.saml2.provider=OFF
logging.level.org.opensaml=OFF

# Enable console colors for better readability
spring.output.ansi.enabled=always
spring.output.ansi.console-available=true

# Completely disable Hibernate SQL logging for cleaner output
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicExtractor=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.springframework.orm.jpa=ERROR
logging.level.org.springframework.transaction=ERROR

# ===================================================================
#                     KAFKA CONSUMER CONFIGURATION
# ===================================================================
# Consumer group settings (using dev-specific group to avoid conflicts)
spring.kafka.consumer.group-id=task-management-service-group-dev
spring.kafka.consumer.auto-offset-reset=earliest

# Deserializer settings
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*


# ===================================================================
#                     UNIFIED LOGGING CONFIGURATION
# ===================================================================
# Enable unified logging
unified.logging.enabled=true

# Correlation ID settings
unified.logging.correlation-id.enabled=true
unified.logging.correlation-id.header-name=X-Correlation-ID
unified.logging.correlation-id.auto-generate=true

# JSON format settings
unified.logging.json-format.pretty-print=false
unified.logging.json-format.include-nulls=false

# ===================================================================
#                     MICROSERVICE CONFIGURATION
# ===================================================================
# Service URLs for inter-service communication
# These will be overridden by Docker environment variables in containerized environments
gateway.core.service.url=${GATEWAY_CORE_SERVICE_URL:http://localhost:8096}

# ===================================================================
#                     OPENSEARCH CONFIGURATION
# ===================================================================
# OpenSearch settings for logging and search capabilities
# These will be overridden by Docker environment variables in containerized environments
opensearch.url=${OPENSEARCH_URL:http://localhost:9200}
opensearch.username=${OPENSEARCH_USERNAME:admin}
opensearch.password=${OPENSEARCH_PASSWORD:!Admin123456}
# IGA compliance: task execution logs are immutable audit evidence.
# Indices become read-only after 30 days, and are deleted after 365 days (1-year minimum).
# Override via environment variables for regulated deployments requiring longer retention.
opensearch.log-retention.read-only-after-days=${LOG_RETENTION_READ_ONLY_DAYS:30}
opensearch.log-retention.delete-after-days=${LOG_RETENTION_DELETE_DAYS:365}


# ===================================================================
# SERVICE DISCOVERY CONFIGURATION
# ===================================================================

# gRPC client configuration for the Configuration Service
grpc.client.configuration-service.address=${CONFIG_GRPC_ADDRESS:dns:///localhost:9091}
grpc.client.configuration-service.negotiation-type=plaintext

# gRPC client configuration for the Connector Runtime Service
grpc.client.connector-runtime-service.address=${CONNECTOR_GRPC_ADDRESS:dns:///localhost:9094}
grpc.client.connector-runtime-service.negotiation-type=plaintext

# gRPC client configuration for the Core
grpc.client.core-service.address=${CONNECTOR_CORE_SERVICE_ADDRESS:dns:///localhost:8003}
grpc.client.core-service.negotiation-type=plaintext

# gRPC client configuration for the Identities Service
grpc.client.identity-service.address=${IDENTITIES_GRPC_ADDRESS:dns:///localhost:9096}
grpc.client.identity-service.negotiation-type=plaintext
# Increase max message size for batch import payloads (default 4MB → 64MB)
grpc.client.identity-service.max-inbound-message-size=67108864
