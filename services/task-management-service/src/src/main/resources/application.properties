spring.profiles.active=dev

# ===================================================================
# gRPC Service Configuration (for internal service-to-service communication)
# ===================================================================
# These properties are used by GrpcClientConfig to establish gRPC connections
# They can be overridden by environment variables in containerized environments

# Core Service gRPC Configuration
core-service.grpc.host=${GRPC_CORE_SERVICE_HOST:localhost}
core-service.grpc.port=${GRPC_CORE_SERVICE_PORT:9095}

# Connector Runtime Service gRPC Configuration
connector-runtime-service.grpc.host=${GRPC_CONNECTOR_RUNTIME_SERVICE_HOST:localhost}
connector-runtime-service.grpc.port=${GRPC_CONNECTOR_RUNTIME_SERVICE_PORT:9094}

# Identity Service gRPC Configuration
identity-service.grpc.host=${GRPC_IDENTITY_SERVICE_HOST:localhost}
identity-service.grpc.port=${GRPC_IDENTITY_SERVICE_PORT:9096}

# Auth Service gRPC Configuration (for UserIdentityService)
auth-service.grpc.host=${GRPC_AUTH_SERVICE_HOST:localhost}
auth-service.grpc.port=${GRPC_AUTH_SERVICE_PORT:8002}