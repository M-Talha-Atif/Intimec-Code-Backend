# ===================================================================
#                     APPLICATION CONFIGURATION
# ===================================================================
spring.application.name=configuration-service
# The port inside the container. The actual exposed port is mapped in docker-compose.
server.port=8092

# ===================================================================
#                     DATABASE CONFIGURATION (FOR DOCKER)
# ===================================================================
# Connect to the postgres service on the Docker network.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/intimec}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lol123a@}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update


# ===================================================================
#                   DATABASE CONFIGURATION - JAKARTA PERSISTENCE
# ===================================================================
# Explicitly set the Hibernate dialect - this is the key fix
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Alternative approach - use database-platform (should work too)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Force Hibernate to use the dialect without trying to detect it
spring.jpa.properties.hibernate.dialect_resolvers=

# Additional Hibernate properties that may help
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ===================================================================
#                     KAFKA PRODUCER CONFIGURATION (FOR DOCKER)
# ===================================================================
# Connect to the kafka service on the Docker network.
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ===================================================================
#                     SPRING CLOUD BUS CONFIGURATION
# ===================================================================
spring.cloud.bus.enabled=true
spring.cloud.bus.id=${spring.application.name}:${spring.application.instance_id:${random.value}}
spring.cloud.bus.destination=services-bus-topic

# ===================================================================
#                     GRPC SERVICE CONFIGURATION
# ===================================================================
# Listen on all network interfaces inside the container.
grpc.server.port=9091

# Client config for the REST-to-gRPC facade calls.
# It connects to its own gRPC port.
grpc.client.self.address=dns:///localhost:9091
grpc.client.self.negotiation-type=plaintext


encryption.master-key=YourSuperSecretAndLongKeyGoesHere_AtLeast32Chars
encryption.salt=a-unique-salt-for-your-auth-service

# ===================================================================
#                     JWT CONFIGURATION
# ===================================================================
# JWT secret key (should match the one used by auth service and API gateway)
jwt.secret=mySuperSecretKey12345678901234AZERTY123456789
jwt.expiration=900000