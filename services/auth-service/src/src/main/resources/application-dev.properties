# ===================================================================
#                     APPLICATION CONFIGURATION
# ===================================================================
# Environment and basic application settings
sp.environment=dev
spring.application.name=auth-service
server.port=8090
app.base-url=http://localhost:8090

# ===================================================================
#                     DATABASE CONFIGURATION
# ===================================================================
# PostgreSQL database connection settings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/intimec}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:0;ZA9V{2`2Hu}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# ===================================================================
#                     SECURITY & JWT CONFIGURATION
# ===================================================================
# JWT token settings
jwt.secret=mySuperSecretKey12345678901234AZERTY123456789
jwt.expiration=900000
security.jwt.refresh-token.expiration-ms=604800000

# Password encoding strength
security.password.encoder.strength=10

# ===================================================================
#                     FRONTEND INTEGRATION
# ===================================================================
# Frontend application URLs and callback endpoints
front.url=http://localhost:3000
front.url.callback=/auth/callback
front.url.sso_callback=/auth/callback

# ===================================================================
#                     SAML/API GATEWAY CONFIGURATION  
# ===================================================================
# External URL configuration for SAML behind API Gateway
# This ensures SAML URLs use the gateway URL instead of internal service names
server.forward-headers-strategy=native
server.use-forward-headers=true


# ===================================================================
#                     SESSION CONFIGURATION
# ===================================================================
# Session settings for OAuth2/SAML flows
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.tracking-modes=cookie
spring.session.store-type=none

# ===================================================================
#                     EMAIL CONFIGURATION
# ===================================================================
# SMTP settings for password reset emails
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=info.intimec@gmail.com
spring.mail.password=oaef ycjg erye qtyd
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.service=gmail

# ===================================================================
#                     SPRING BOOT CONFIGURATION
# ===================================================================
# Auto-configuration exclusions
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

# Template engine configuration
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=false

# ===================================================================
#                     SPRING CLOUD CONFIGURATION
# ===================================================================
# Spring Cloud Config Client settings
spring.cloud.config.enabled=false
spring.cloud.config.fail-fast=false
spring.cloud.config.retry.initial-interval=1000
spring.cloud.config.retry.max-interval=2000
spring.cloud.config.retry.max-attempts=6

spring.cloud.config.import-check.enabled=false

# ===================================================================
#                     PASSWORD EXPIRATION NOTIFICATION CONFIGURATION
# ===================================================================
# Password expiration notification settings
aidentx.auth.password-expiration-notification.enabled=true
aidentx.auth.password-expiration-notification.cron-expression=0 0 9,21 * * *
aidentx.auth.password-expiration-notification.batch-size=100

# For testing, you can temporarily change to run every minute:
#aidentx.auth.password-expiration-notification.cron-expression=0 * * * * *

# ===================================================================
#                     SPRING BOOT ACTUATOR CONFIGURATION
# ===================================================================
# Enable actuator endpoints for configuration refresh
management.endpoints.web.exposure.include=health,info,refresh,configprops,env
management.endpoint.refresh.enabled=true
management.endpoint.configprops.enabled=true
management.endpoint.env.enabled=true
management.endpoints.web.base-path=/actuator

# Disable LDAP health check
management.health.ldap.enabled=false

# ===================================================================
#                     LOGGING CONFIGURATION
# ===================================================================
# Disable verbose SAML/OAuth2 logging (detailed logging is in log4j2.json)
logging.level.org.springframework.security.saml2=OFF
logging.level.org.springframework.security.saml2.provider=OFF
logging.level.org.opensaml=OFF

# Enable console colors for better readability
spring.output.ansi.enabled=always
spring.output.ansi.console-available=true

# Database connection and error logging
logging.level.org.springframework.boot.autoconfigure.jdbc=INFO
logging.level.org.springframework.jdbc.datasource=INFO
logging.level.org.springframework.boot.autoconfigure.orm.jpa=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.postgresql=WARN

# Show database connection errors clearly
logging.level.org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration=INFO
logging.level.org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=WARN
logging.level.org.springframework.jdbc.support.SQLErrorCodeSQLExceptionTranslator=WARN
logging.level.org.springframework.dao=WARN

# Hide verbose SQL but show connection errors
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicExtractor=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=WARN
logging.level.org.springframework.orm.jpa=WARN
logging.level.org.springframework.transaction=WARN

# ===================================================================
#                     UNIFIED LOGGING CONFIGURATION
# ===================================================================
# Enable unified logging
unified.logging.enabled=true

# Set the default source name for this microservice
unified.logging.default-source=auth-service

# Correlation ID Configuration
unified.logging.correlation-id.enabled=true
unified.logging.correlation-id.auto-generate=true
unified.logging.correlation-id.header-name=X-Correlation-ID

# JSON Format Configuration
unified.logging.json-format.enabled=true
unified.logging.json-format.pretty-print=false
unified.logging.json-format.include-nulls=false

# AI Insights Configuration (disabled for now)
unified.logging.ai-insights.enabled=false

# ===================================================================
#                    ENCRYPTION SERVICE CONFIGURATION
# ===================================================================
# A high-entropy secret key used for master key derivation.
# MUST be at least 32 characters long.
# Environment Variable Override: ENCRYPTION_MASTER_KEY
encryption.master-key=YourSuperSecretAndLongKeyGoesHere_AtLeast32Chars

# A static, unique salt for your application.
# Environment Variable Override: ENCRYPTION_SALT
encryption.salt=a-unique-salt-for-your-auth-service

# ===================================================================
#                     KAFKA PRODUCER CONFIGURATION
# ===================================================================
# Address of the Kafka broker (use your local IP since Kafka advertises this)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Kafka serializer class for the message key
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# Kafka serializer class for the message value
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# JSON type mapping for notifications
spring.kafka.producer.properties.spring.json.type.mapping=notificationEvent:com.aidentx.authservice.model.kafka.NotificationEventData
spring.kafka.producer.properties.spring.json.add.type.headers=true

# Kafka topic for audit logs
auditlog.kafka.topic=audit-log

# Kafka topic for notifications
notification.kafka.topic=user-notifications

kafka.enabled=true

# Add these resilience configurations
spring.kafka.producer.acks=1
spring.kafka.producer.retries=0
spring.kafka.producer.batch-size=16384
spring.kafka.producer.linger-ms=5
spring.kafka.producer.buffer-memory=33554432

# Important: Don't block on send failures
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.request-timeout-ms=10000
spring.kafka.producer.delivery-timeout-ms=15000

# ===================================================================
#                     SPRING CLOUD BUS CONFIGURATION
# ===================================================================
spring.cloud.bus.enabled=true
spring.cloud.bus.id=${spring.application.name}:${spring.application.instance_id:${random.value}}
spring.cloud.bus.destination=services-bus-topic

# ===================================================================
#                     GRPC CONFIGURATION
# ===================================================================
# gRPC server settings
grpc.server.port=${GRPC_SERVER_PORT:8002}
grpc.server.address=0.0.0.0

# gRPC client settings
grpc.client.configuration-service.address=${CONFIG_GRPC_ADDRESS:dns:///localhost:9091}
grpc.client.configuration-service.negotiation-type=plaintext

# ===================================================================
#                     PASSWORD EXPIRATION NOTIFICATION CONFIGURATION
# ===================================================================
# Configuration is defined above in the main section
