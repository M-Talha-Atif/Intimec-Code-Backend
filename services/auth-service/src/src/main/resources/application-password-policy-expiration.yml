# Example configuration for Password Policy Expiration Service
# Add these properties to your application.yml or application.properties

aidentx:
  auth:
    password-policy:
      expiration:
        # Enable/disable automatic password policy extension
        enabled: true
        
        # Cron expression for when to run the extension job
        # Default: "0 0 2 * * *" (daily at 2:00 AM)
        # Examples:
        # - "0 0 2 * * *"     # Daily at 2:00 AM
        # - "0 0 */12 * * *"  # Every 12 hours
        # - "0 0 0 * * SUN"   # Weekly on Sunday at midnight
        # - "0 30 1 * * *"    # Daily at 1:30 AM
        cron-expression: "0 0 2 * * *"
        
        # Maximum number of policies to process in a single run
        # This prevents memory issues with large numbers of expired policies
        max-policies-per-run: 1000

# Alternative configuration in application.properties format:
# aidentx.auth.password-policy.expiration.enabled=true
# aidentx.auth.password-policy.expiration.cron-expression=0 0 2 * * *
# aidentx.auth.password-policy.expiration.max-policies-per-run=1000
